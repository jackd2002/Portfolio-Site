<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jack's Beanstalk Sky Drop</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      .back-to-portfolio {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 9999;
        pointer-events: auto;
        text-decoration: none;
        background: #1a0f3d;
        border: 1px solid #d4a017;
        color: #ffd700;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }
      .back-to-portfolio:hover {
        background: #2a1a55;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }

      /* ── Branded loading screen ─────────────────────────────────────────── */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a0f3d;
        transition: opacity 0.3s ease;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Error state: stop the bar, tint it red, reveal the message. */
      #loading-screen.error #loading-bar-fill {
        background: linear-gradient(to right, #7a1d1d, #ff5a5a, #7a1d1d);
      }
      #loading-error {
        display: none;
        margin-top: 18px;
        max-width: 60vw;
        text-align: center;
        color: #ff8a8a;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.4;
      }
      #loading-screen.error #loading-error {
        display: block;
      }
      #loading-screen img {
        width: 180px;
        max-width: 60vw;
        height: auto;
        margin-bottom: 28px;
      }
      #loading-bar-track {
        width: 240px;
        max-width: 60vw;
        height: 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 215, 0, 0.35);
        overflow: hidden;
      }
      #loading-bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(to right, #b8860b, #ffd700, #b8860b);
        transition: width 0.25s ease;
      }
    </style>
    <script type="module" crossorigin src="/beanstalk/assets/index-B8HrjqLn.js"></script>
  </head>
  <body>
    <div id="loading-screen">
      <img src="/beanstalk/assets/loading-icon.png" alt="Loading" />
      <div id="loading-bar-track">
        <div id="loading-bar-fill"></div>
      </div>
      <div id="loading-error"></div>
    </div>

    <a href="/" class="back-to-portfolio">← All Games</a>

    <script>
      (function () {
        var screen = document.getElementById('loading-screen');
        var fill = document.getElementById('loading-bar-fill');
        var note = document.getElementById('loading-error');
        if (!screen || !fill) return;

        var done = false;
        var errored = false;
        var shown = 0;   // highest fraction shown — keep the bar monotonic

        // REAL progress: main() reports the actual asset-load fraction (0..1).
        // The bar reflects true completion, not a timer, and only reaches 100%
        // when assets are genuinely done.
        window.__beanstalkProgress = function (f) {
          if (done || errored) return;
          if (typeof f !== 'number' || isNaN(f)) return;
          if (f < 0) f = 0;
          if (f > 1) f = 1;
          if (f <= shown) return;
          shown = f;
          fill.style.width = (f * 100).toFixed(1) + '%';
        };

        function complete() {
          if (done || errored) return;
          done = true;
          clearTimeout(safety);
          fill.style.width = '100%';
          // Prompt dismissal: just the ~0.3s fade, no extra pre-wait.
          screen.classList.add('hidden');
          setTimeout(function () {
            if (screen.parentNode) screen.parentNode.removeChild(screen);
          }, 300);   // matches the 0.3s opacity transition
        }

        function fail(message) {
          if (done || errored) return;
          errored = true;
          clearTimeout(safety);
          screen.classList.add('error');   // tint the bar, reveal the message
          if (note) note.textContent = message || 'Failed to load. Please refresh the page.';
        }

        // game:ready is the REAL dismissal signal — fired by main() only after
        // every asset load and all init complete. __beanstalkError surfaces a
        // load/init failure as an error state instead of a broken board.
        window.__beanstalkReady = complete;
        window.__beanstalkError = function (message) { fail(message); };

        // Safety cap: if neither ready nor error ever fires (e.g. a silent
        // network stall), show an error rather than hanging forever or
        // dismissing onto a broken board.
        var safety = setTimeout(function () {
          fail('Loading timed out. Please refresh the page.');
        }, 30000);
      })();
    </script>
  </body>
</html>
